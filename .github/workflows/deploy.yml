name: Deploy OpenCode v2 (vpn4)

# Manual deploy of the isolated OpenCode v2 stack to /opt/opencode2 on vpn4.
# Volumes are never removed; rollback = redeploy an earlier commit SHA.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA of this repository to deploy
        required: true

concurrency:
  group: deploy-vpn4-host
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::ref must be a full 40-char commit SHA"; exit 1; }

      - name: Check required secrets
        env:
          OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
          CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          OPENCODE_SSH_PRIVATE_KEY: ${{ secrets.OPENCODE_SSH_PRIVATE_KEY }}
          OPENCODE_SSH_KNOWN_HOSTS: ${{ secrets.OPENCODE_SSH_KNOWN_HOSTS }}
          SSH_HOST_VPN4: ${{ secrets.SSH_HOST_VPN4 }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          for name in OPENCODE_SERVER_PASSWORD CLIPROXY_API_KEY OPENCODE_SSH_PRIVATE_KEY OPENCODE_SSH_KNOWN_HOSTS SSH_HOST_VPN4 SSH_USER SSH_KEY TS_AUTHKEY; do
            test -n "${!name}" || { echo "::error::missing secret $name"; exit 1; }
          done
          printf '%s' "$TS_AUTHKEY" | grep -Eq '^[A-Za-z0-9_-]+$' || { echo "::error::TS_AUTHKEY has an invalid format"; exit 1; }
          echo "required secrets present"

      # User accepted deploy-key-only transport verification; host-key pinning is intentionally disabled.
      - name: Preflight vpn4 SSH transport (deploy-key only)
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          command_timeout: 1m
          script: |
            true

      - name: Deploy stack to vpn4
        id: deploy
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: REF,TS_AUTHKEY,OPENCODE_SERVER_PASSWORD,CLIPROXY_API_KEY,OPENCODE_SSH_PRIVATE_KEY,OPENCODE_SSH_KNOWN_HOSTS
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo -E"; else SUDO=""; fi
            DEST=/opt/opencode2
            $SUDO mkdir -p "$DEST"
            if [ ! -d "$DEST/.git" ]; then
              $SUDO git clone -q https://github.com/vanbienperu3107/opencode2-deploy.git "$DEST"
            fi
            cd "$DEST"
            $SUDO git config --global --add safe.directory "$DEST" || true
            $SUDO git fetch -q origin
            $SUDO git checkout --detach -q "$REF"
            test "$($SUDO git rev-parse HEAD)" = "$REF"
            $SUDO docker network inspect edge >/dev/null 2>&1 || $SUDO docker network create edge

            # The pre-auth key is supplied by the operator through the TS_AUTHKEY
            # secret; it is only used on the first join while the state volume is empty.
            printf '%s' "$TS_AUTHKEY" | grep -Eq '^[A-Za-z0-9_-]+$' || { echo 'TS_AUTHKEY has an invalid format' >&2; exit 1; }

            # Tailscale ignores the auth key once its state volume holds an identity,
            # so redeploys keep the same Tailnet node.
            $SUDO env OUTPUT_DIR="$DEST" OPENCODE_SERVER_PASSWORD="$OPENCODE_SERVER_PASSWORD" \
              CLIPROXY_API_KEY="$CLIPROXY_API_KEY" TS_AUTHKEY="$TS_AUTHKEY" \
              OPENCODE_SSH_PRIVATE_KEY="$OPENCODE_SSH_PRIVATE_KEY" \
              OPENCODE_SSH_KNOWN_HOSTS="$OPENCODE_SSH_KNOWN_HOSTS" \
              bash scripts/render-runtime-env.sh
            RUNTIME_ENV="$DEST/current/.env"
            $SUDO docker compose --env-file "$RUNTIME_ENV" -p opencode2-deploy config -q
            $SUDO docker compose --env-file "$RUNTIME_ENV" -p opencode2-deploy pull -q
            $SUDO docker compose --env-file "$RUNTIME_ENV" -p opencode2-deploy up -d --remove-orphans
            for i in $(seq 1 30); do
              state=$($SUDO docker inspect -f '{{.State.Health.Status}}' opencode2-deploy-opencode2-1 2>/dev/null || echo starting)
              echo "  opencode2 health: $state"
              if [ "$state" = healthy ]; then break; fi
              sleep 5
            done
            [ "$state" = healthy ] || { $SUDO docker compose -p opencode2-deploy logs --tail 60; exit 1; }
            $SUDO docker exec opencode2-deploy-ts-opencode2-1 tailscale status --self --peers=false
            echo "deployed $REF"
        env:
          REF: ${{ inputs.ref }}
          OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
          CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          OPENCODE_SSH_PRIVATE_KEY: ${{ secrets.OPENCODE_SSH_PRIVATE_KEY }}
          OPENCODE_SSH_KNOWN_HOSTS: ${{ secrets.OPENCODE_SSH_KNOWN_HOSTS }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

      - name: Verify public endpoint requires authentication
        env:
          OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          url=https://opencode2.hangocthanh.io.vn/global/health
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
            echo "  unauthenticated -> ${code:-000}"
            if [ "$code" = 401 ]; then break; fi
            sleep 6
          done
          [ "$code" = 401 ] || { echo "::error::expected 401 without credentials, got $code"; exit 1; }
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 -u "opencode:$OPENCODE_SERVER_PASSWORD" "$url")
          echo "  authenticated -> $code"
          [ "$code" = 200 ] || { echo "::error::authenticated health failed"; exit 1; }
          python3 -c 'import json; d=json.load(open("/tmp/health.json")); print("healthy=%s version=%s" % (d.get("healthy"), d.get("version")))'
