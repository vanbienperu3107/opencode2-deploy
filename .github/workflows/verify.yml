name: Verify OpenCode v2 (vpn4)

# Post-deploy acceptance checks against production. Does not redeploy or change
# configuration. Side effects are limited and reverted: one verification
# session (deleted at the end), one `opencode2` container restart to prove
# persistence, and a temporary fail2ban ban of this runner's IP (unbanned).
on:
  workflow_dispatch:

concurrency:
  group: deploy-vpn4-host
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE_URL: https://opencode2.hangocthanh.io.vn

jobs:
  service-check:
    runs-on: ubuntu-latest
    outputs:
      session_id: ${{ steps.prompt.outputs.session_id }}
    steps:
      - name: Auth boundary and configuration
        env:
          PW: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE_URL/api/info")
          echo "unauthenticated /api/info -> $code"; [ "$code" = 401 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -u "opencode:not-the-password" "$BASE_URL/api/info")
          echo "wrong password /api/info -> $code"; [ "$code" = 401 ]
          curl -sf --max-time 15 -u "opencode:$PW" "$BASE_URL/api/info" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("version=%s" % d["version"])'
          curl -sf --max-time 15 -u "opencode:$PW" "$BASE_URL/api/model/default" > /tmp/default.json
          python3 - <<'EOF'
          import json
          raw = json.load(open("/tmp/default.json"))
          text = json.dumps(raw)
          assert "cliproxy" in text and "deepseek-v4-flash" in text, "default model is not cliproxy/deepseek-v4-flash"
          print("default model is cliproxy/deepseek-v4-flash")
          EOF

      - name: CLIProxy completion through OpenCode
        id: prompt
        env:
          PW: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          auth=(-u "opencode:$PW" -H 'Content-Type: application/json' --max-time 30)
          sid=$(curl -sf "${auth[@]}" -X POST "$BASE_URL/api/session" -d '{"title":"ci-verify","location":{"directory":"/workspace/projects"},"agent":"build","model":{"id":"claude-opus-5","providerID":"cliproxy"}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')
          echo "session_id=$sid" >> "$GITHUB_OUTPUT"
          echo "session $sid"
          curl -sf "${auth[@]}" -X POST "$BASE_URL/api/session/$sid/prompt" -d '{"text":"Reply with exactly the single word PONG and nothing else.","delivery":"steer","metadata":{"displayText":"Reply with exactly the single word PONG and nothing else.","agent":"build","model":{"id":"claude-opus-5","providerID":"cliproxy"}}}' >/dev/null
          curl -sf -u "opencode:$PW" --max-time 240 -X POST "$BASE_URL/api/experimental/session/$sid/wait" >/dev/null || true
          for i in $(seq 1 24); do
            curl -sf -u "opencode:$PW" --max-time 30 "$BASE_URL/api/session/$sid/message" > /tmp/messages.json
            if python3 - <<'EOF'
          import json
          data = json.load(open("/tmp/messages.json")).get("data", [])
          assistant = [m for m in data if m.get("type") == "assistant"]
          complete = [m for m in assistant if (m.get("time") or {}).get("completed")]
          raise SystemExit(0 if complete else 1)
          EOF
            then break; fi
            sleep 5
          done
          python3 - <<'EOF'
          import json
          data = json.load(open("/tmp/messages.json")).get("data", [])
          assistant = [m for m in data if m.get("type") == "assistant"]
          complete = [m for m in assistant if (m.get("time") or {}).get("completed")]
          summary = [{"finish": m.get("finish"), "content_types": [p.get("type") for p in m.get("content", [])], "has_error": bool(m.get("error"))} for m in complete]
          print("assistant message summary:", summary)
          print("provider error kinds:", [{"type": m["error"].get("type"), "status": m["error"].get("status")} for m in complete if m.get("error")])
          assert complete, "CLIProxy did not complete an assistant message"
          assert not any(m.get("error") for m in complete), "assistant reported a provider error"
          print("assistant completion received through cliproxy/claude-opus-5")
          EOF

  browser:
    # Playwright 1.56 cannot install browser dependencies on ubuntu-26.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --silent playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Render web UI on desktop and mobile
        env:
          PW: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
        run: |
          cat > ui.mjs <<'EOF'
          import { chromium, devices } from "playwright"
          const base = process.env.BASE_URL
          const browser = await chromium.launch()
          const viewports = {
            desktop: { viewport: { width: 1440, height: 900 } },
            mobile: { ...devices["Pixel 7"] },
          }
          let failed = false
          for (const [name, options] of Object.entries(viewports)) {
            const context = await browser.newContext({
              ...options,
              httpCredentials: { username: "opencode", password: process.env.PW, send: "always" },
            })
            const page = await context.newPage()
            const errors = []
            page.on("console", (m) => {
              if (m.type() === "error" && !/status of 401/.test(m.text())) errors.push(m.text())
            })
            page.on("pageerror", (e) => errors.push(String(e)))
            const response = await page.goto(base + "/", { waitUntil: "networkidle", timeout: 60000 })
            const usePassword = page.getByRole("button", { name: "Use password" })
            if (await usePassword.isVisible()) {
              await usePassword.click()
              await page.locator("#server-connect-url").fill(base)
              await page.locator("#server-connect-password").fill(process.env.PW)
              await page.getByRole("button", { name: "Connect" }).click()
              await page.waitForTimeout(3000)
            }
            await page.screenshot({ path: `ui-${name}.png`, fullPage: true })
            const metrics = await page.evaluate(() => {
              const overflowX = document.documentElement.scrollWidth > window.innerWidth + 1
              const sizes = [...document.querySelectorAll("body *")]
                .filter((el) => el.childElementCount === 0 && el.textContent.trim() && el.getBoundingClientRect().width > 0)
                .map((el) => parseFloat(getComputedStyle(el).fontSize))
              const body = document.body.innerText
              return { overflowX, minFont: sizes.length ? Math.min(...sizes) : 0, textLength: body.length, connectScreen: /Connect to a server/.test(body), sample: body.slice(0, 200) }
            })
            console.log(name, "status", response.status(), JSON.stringify(metrics))
            console.log(name, "console errors", errors.length, errors.slice(0, 5))
            if (response.status() !== 200) failed = true
            if (metrics.textLength < 20) { console.log(name, "page rendered almost no text"); failed = true }
            if (metrics.connectScreen) { console.log(name, "still on connect screen after password flow"); failed = true }
            if (metrics.overflowX) { console.log(name, "horizontal overflow"); failed = true }
            if (metrics.minFont && metrics.minFont < 11) { console.log(name, "text smaller than 11px"); failed = true }
            if (errors.length) failed = true
            await context.close()
          }
          await browser.close()
          process.exit(failed ? 1 : 0)
          EOF
          node ui.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screenshots
          path: ui-*.png
          retention-days: 3

  host:
    needs: [service-check, browser]
    if: always() && needs.service-check.outputs.session_id != '' && needs.browser.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Tailnet, persistence and fail2ban on vpn4
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          SESSION_ID: ${{ needs.service-check.outputs.session_id }}
          PW: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: SESSION_ID,PW
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo -E"; else SUDO=""; fi
            APP=opencode2-deploy-opencode2-1
            TS=opencode2-deploy-ts-opencode2-1

            echo "== Tailnet"
            $SUDO docker exec "$TS" tailscale status --self --peers=false
            peer=$($SUDO docker exec "$TS" tailscale status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); ps=[p for p in (d.get("Peer") or {}).values() if p.get("Online")]; print(ps[0]["TailscaleIPs"][0] if ps else "")')
            if [ -n "$peer" ]; then $SUDO docker exec "$TS" tailscale ping -c 3 "$peer" | tail -n 1; else echo "no online peer to ping"; exit 1; fi

            echo "== Runtime CLIProxy credential"
            code=$($SUDO docker exec "$APP" sh -c 'wget -q -S -O /dev/null --header "Authorization: Bearer $CLIPROXY_API_KEY" https://cliproxy.hangocthanh.io.vn/v1/models 2>&1 | awk "/HTTP\// {code=\$2} END {print code}"')
            echo "runtime CLIProxy models -> ${code:-000}"
            [ "$code" = 200 ] || { echo "::error::runtime CLIPROXY_API_KEY was rejected"; exit 1; }
            code=$($SUDO docker exec "$APP" sh -c 'printf "%s" "{\"model\":\"claude-opus-5\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}" | wget -q -S -O /dev/null --post-file=- --header "Content-Type: application/json" --header "Authorization: Bearer $CLIPROXY_API_KEY" https://cliproxy.hangocthanh.io.vn/v1/chat/completions 2>&1 | awk "/HTTP\\/.* [0-9]{3}/ {code=\$2} END {print code}"')
            echo "runtime CLIProxy completion -> ${code:-000}"
            [ "$code" = 200 ] || { echo "::error::runtime CLIPROXY_API_KEY cannot create completions"; exit 1; }

            echo "== Persistence across restart"
            $SUDO docker exec "$APP" sh -c 'echo persist-check > /workspace/projects/.ci-persist && test -d /root'
            $SUDO docker restart "$APP" >/dev/null
            for i in $(seq 1 30); do
              state=$($SUDO docker inspect -f '{{.State.Health.Status}}' "$APP")
              if [ "$state" = healthy ]; then break; fi
              sleep 5
            done
            echo "health after restart: $state"; [ "$state" = healthy ]
            $SUDO docker exec "$APP" sh -c 'grep -qx persist-check /workspace/projects/.ci-persist && rm -f /workspace/projects/.ci-persist && echo "workspace volume: PASS"'
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "opencode:$PW" "https://opencode2.hangocthanh.io.vn/api/session/$SESSION_ID")
            echo "session survives restart -> $code"; [ "$code" = 200 ]

            echo "== fail2ban"
            $SUDO docker exec edge-fail2ban fail2ban-client status opencode2-401
            $SUDO docker exec edge-fail2ban sh -c 'fail2ban-regex /remotelogs/opencode2-access.log /config/fail2ban/filter.d/opencode2-401.conf' | grep -E 'Failregex|Date template hits|Lines:|matched' | head -n 12 || true
            $SUDO docker exec caddy-edge sh -c 'tail -n 200 /var/log/caddy/opencode2-access.log' | grep -c '"status":401' | sed 's/^/401 lines in recent log: /'
            # Show which client-IP keys the access log really carries (values masked).
            $SUDO docker exec caddy-edge sh -c 'grep "\"status\":401" /var/log/caddy/opencode2-access.log | tail -n 1' \
              | python3 -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); r=d.get("request") or {}; print("log keys:", sorted(d)); print("request keys:", sorted(r)); print("ip fields:", {k: ("set" if r.get(k) else "empty") for k in ("remote_ip","client_ip","remote_port")})'

            echo "== fail2ban diagnostics"
            F2B="$SUDO docker exec edge-fail2ban"
            for key in datepattern findtime maxretry logpath ignoreip; do
              printf '%s: ' "$key"; $F2B fail2ban-client get opencode2-401 "$key" 2>&1 | tr '\n' ' ' | sed -E 's/([0-9]+\.){3}[0-9]+/<ip>/g'; echo
            done
            $F2B fail2ban-client status opencode-401 2>&1 | grep -E 'Total (failed|banned)' | sed 's/^/v1 jail /'
            $F2B sh -c 'date -u +now=%s; stat -c "log mtime=%Y size=%s" /remotelogs/opencode2-access.log'
            $SUDO docker exec caddy-edge sh -c 'grep "\"status\":401" /var/log/caddy/opencode2-access.log | tail -n 1' \
              | python3 -c 'import json,sys; print("last 401 ts:", json.loads(sys.stdin.read() or "{}").get("ts"))'
            $F2B sh -c 'fail2ban-regex /remotelogs/opencode2-access.log /config/fail2ban/filter.d/opencode2-401.conf' \
              | sed -n '/Date template hits/,/^Lines:/p' | sed -E 's/([0-9]+\.){3}[0-9]+/<ip>/g'
            $F2B sh -c 'ls /config/log/fail2ban/ 2>/dev/null; tail -n 300 /config/log/fail2ban/fail2ban.log 2>/dev/null' \
              | grep -i -E 'opencode2|error|warn|ignor' | tail -n 25 | sed -E 's/([0-9]+\.){3}[0-9]+/<ip>/g'


  fail2ban-ban:
    needs: host
    if: needs.host.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      runner_ip: ${{ steps.ip.outputs.ip }}
    steps:
      - id: ip
        run: echo "ip=$(curl -sf --max-time 10 https://api.ipify.org)" >> "$GITHUB_OUTPUT"
      - name: Trigger the opencode2-401 jail from this runner
        run: |
          for i in $(seq 1 8); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -u "opencode:wrong-$i" "$BASE_URL/api/info" || true)
            echo "attempt $i -> ${code:-000}"
            sleep 1
          done
          sleep 15
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL/api/info" || true)
          echo "after repeated 401s -> ${code:-000} (000 means banned)"
          [ "${code:-000}" = 000 ]

  cleanup:
    needs: [service-check, host, fail2ban-ban]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Unban runner and delete verification session
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          RUNNER_IP: ${{ needs.fail2ban-ban.outputs.runner_ip }}
          SESSION_ID: ${{ needs.service-check.outputs.session_id }}
          PW: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: RUNNER_IP,SESSION_ID,PW
          script_stop: false
          command_timeout: 3m
          script: |
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo -E"; else SUDO=""; fi
            if printf '%s' "$RUNNER_IP" | grep -Eq '^[0-9.]+$'; then
              $SUDO docker exec edge-fail2ban fail2ban-client set opencode2-401 unbanip "$RUNNER_IP" && echo "unbanned runner"
            fi
            if printf '%s' "$SESSION_ID" | grep -Eq '^[A-Za-z0-9_-]+$'; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -u "opencode:$PW" -X DELETE "https://opencode2.hangocthanh.io.vn/api/session/$SESSION_ID")
              echo "delete verification session -> $code"
            fi
            $SUDO docker exec edge-fail2ban fail2ban-client status opencode2-401 | grep -i 'banned'
