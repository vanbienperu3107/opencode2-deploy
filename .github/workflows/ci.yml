name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render Compose configuration
        run: docker compose --env-file tests/compose-ci.env config --format json
      - name: Test validation contracts
        run: python3 -m unittest -v tests.test_contracts tests.test_compose_contract_devices tests.test_auto_update
      - name: Test runtime Compose contract
        run: bash tests/compose-contract.sh
      - name: Validate public baseline
        run: |
          bash tests/validate-config.sh
          bash tests/ssh-policy-contract.sh
          bash tests/deploy-workflow-contract.sh
