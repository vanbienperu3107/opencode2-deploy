services:
  ts-opencode2:
    image: tailscale/tailscale:v1.104.4
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY must be set and nonempty for deployment}
      TS_EXTRA_ARGS: --login-server=https://vpn2.hangocthanh.io.vn --hostname=opencode2 --accept-dns=false
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - opencode2_tailscale_state:/var/lib/tailscale
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        # Caddy on the edge network proxies to opencode2:4096; the app shares
        # this sidecar's network namespace, so the alias must live here.
        aliases:
          - opencode2

  opencode2:
    # Built from this repository's Dockerfile so the agent keeps its CLI
    # tooling; OPENCODE_IMAGE is the single pinned upstream release that
    # the auto-update workflow rewrites.
    image: opencode2-tools:2.4.1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCODE_IMAGE: ghcr.io/anomalyco/opencode:2.4.1
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    restart: unless-stopped
    init: true
    depends_on:
      - ts-opencode2
    network_mode: service:ts-opencode2
    working_dir: /workspace/projects
    env_file:
      - ./secrets/hindsight-runtime.env
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD must be set and nonempty for deployment}
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY:-}
      OBSCURA_MCP_TOKEN: ${OBSCURA_MCP_TOKEN:?OBSCURA_MCP_TOKEN must be set and nonempty for deployment}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY must be set and nonempty for deployment}
      NODE_EXTRA_CA_CERTS: /etc/opencode/hindsight-ca.crt
      HINDSIGHT_RECALL_LOG: /root/.local/state/hindsight-recall/recall.log
      OPENCODE_CONFIG: /etc/opencode/opencode.jsonc
      # Runtime overrides have higher precedence than persisted user config.
      OPENCODE_CONFIG_CONTENT: '{"model":"cliproxy/claude-opus-5"}'
    volumes:
      - opencode2_workspace:/workspace/projects
      - opencode2_state:/root
      - ./secrets/hindsight-reader.token:/etc/opencode/secrets/hindsight-reader.token:ro
      - ./secrets/hindsight-writer.token:/etc/opencode/secrets/hindsight-writer.token:ro
    configs:
      - source: opencode-config
        target: /etc/opencode/opencode.jsonc
        mode: 0444
      - source: hindsight-ca
        target: /etc/opencode/hindsight-ca.crt
        mode: 0444
      - source: hindsight-agent
        target: /etc/opencode/hindsight-agent.md
        mode: 0444
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # BusyBox wget does not send URL-embedded credentials, so build the Basic
      # header from the container environment at check time.
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Authorization: Basic $$(printf '%s:%s' \"$$OPENCODE_SERVER_USERNAME\" \"$$OPENCODE_SERVER_PASSWORD\" | base64 | tr -d '\\n')\" http://127.0.0.1:4096/api/info"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  opencode2_workspace:
  opencode2_state:
  opencode2_tailscale_state:

configs:
  opencode-config:
    file: ./opencode.jsonc
  hindsight-ca:
    file: ./hindsight-ca.crt
  hindsight-agent:
    file: ./hindsight-agent.md


networks:
  edge:
    external: true
