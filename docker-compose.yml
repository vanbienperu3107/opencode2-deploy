services:
  ts-opencode2:
    image: tailscale/tailscale:v1.104.4
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY must be set and nonempty for deployment}
      TS_EXTRA_ARGS: --login-server=https://vpn2.hangocthanh.io.vn --hostname=opencode2 --accept-dns=false
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - opencode2_tailscale_state:/var/lib/tailscale
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        # Caddy on the edge network proxies to opencode2:4096; the app shares
        # this sidecar's network namespace, so the alias must live here.
        aliases:
          - opencode2

  opencode2:
    image: ghcr.io/anomalyco/opencode:2.0.32
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    restart: unless-stopped
    init: true
    depends_on:
      - ts-opencode2
    network_mode: service:ts-opencode2
    working_dir: /workspace/projects
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD must be set and nonempty for deployment}
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY:-}
      OPENCODE_CONFIG: /etc/opencode/opencode.jsonc
    volumes:
      - opencode2_workspace:/workspace/projects
      - opencode2_state:/root
    configs:
      - source: opencode-config
        target: /etc/opencode/opencode.jsonc
        mode: 0444
    secrets:
      - source: opencode-ssh-key
        target: opencode_ssh_key
        mode: 0400
      - source: opencode-known-hosts
        target: opencode_known_hosts
        mode: 0400
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # BusyBox wget (Alpine base) reads credentials from the URL; values stay
      # in the container environment and are expanded only at check time.
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://$$OPENCODE_SERVER_USERNAME:$$OPENCODE_SERVER_PASSWORD@127.0.0.1:4096/global/health\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  opencode2_workspace:
  opencode2_state:
  opencode2_tailscale_state:

configs:
  opencode-config:
    file: ./opencode.jsonc

secrets:
  opencode-ssh-key:
    file: ${OPENCODE_SSH_KEY_FILE:?OPENCODE_SSH_KEY_FILE must be set by the runtime renderer}
  opencode-known-hosts:
    file: ${OPENCODE_SSH_KNOWN_HOSTS_FILE:?OPENCODE_SSH_KNOWN_HOSTS_FILE must be set by the runtime renderer}

networks:
  edge:
    external: true
